<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכונים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ספריית המתכונים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow column that works on a phone first. List -> reading view -> editor, one view at a time. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#E7ECE4; --ink:#1D2823; --muted:#58665F; --line:#D3DBD0;
  --accent:#1E6B58; --accent-ink:#FFFFFF; --hl:#F1C453; --hl-ink:#3A2D00; --danger:#B3382C;
  --f-display:'Secular One','Assistant',system-ui,sans-serif;
  --f-body:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#17211D; --surface2:#1F2B26; --ink:#E6EEE9; --muted:#98A8A0; --line:#2B3933;
    --accent:#62C9AB; --accent-ink:#07231A; --hl:#E0B445; --hl-ink:#261D00; --danger:#F08073; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17211D; --surface2:#1F2B26; --ink:#E6EEE9; --muted:#98A8A0; --line:#2B3933;
  --accent:#62C9AB; --accent-ink:#07231A; --hl:#E0B445; --hl-ink:#261D00; --danger:#F08073; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#root{max-width:720px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:10px;padding-block:14px 8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{font-size:1.6rem;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.search{width:100%;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.7;font-weight:400;margin-inline-start:4px}

.cards{display:grid;gap:10px;grid-template-columns:1fr;padding-block:6px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%}
.card:active{background:var(--surface2)}
.ct{font-family:var(--f-display);font-size:1.2rem;line-height:1.25;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm{color:var(--muted);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;padding:2px 9px;border-radius:10px;background:var(--surface2);color:var(--muted);font-weight:600}
.badge{font-family:var(--f-body);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--hl);color:var(--hl-ink)}
.empty{padding:28px 8px;color:var(--muted);text-align:center}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-block:22px 6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.steps-help{margin:0;padding-inline-start:20px;color:var(--muted);display:grid;gap:4px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:46px}
.field textarea{min-height:150px;resize:vertical;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.row .field{flex:1 1 140px}
.notice{padding:10px 12px;border-radius:10px;background:var(--hl);color:var(--hl-ink);font-weight:600}
.err{color:var(--danger);font-weight:600}

.read h1{font-size:2rem;margin-block:6px 6px}
.meta{color:var(--muted);margin-bottom:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px}
.sec{margin-block:20px 8px;font-size:1.3rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:calc(1.08rem * var(--fs))}
.list li button{width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;min-height:46px;display:flex;gap:12px;align-items:flex-start}
.list li button .mk{flex:0 0 22px;height:22px;margin-top:2px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:transparent}
.list li button[aria-pressed="true"]{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.list li button[aria-pressed="true"] .mk{background:var(--accent);color:var(--accent-ink)}
.list.steps li button .mk{border-radius:50%;color:var(--accent);font-family:var(--f-display);font-size:.95rem}
.list.steps li button[aria-pressed="true"] .mk{color:var(--accent-ink)}
.txt{min-width:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:calc(1rem * var(--fs))}
.src{display:inline-flex;margin-top:14px}
.danger-zone{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}

.trow{display:flex;gap:8px;align-items:center}
.trow input{flex:1 1 auto;min-width:0;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.edchips{display:flex;flex-wrap:wrap;gap:8px}

#toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:none}
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;align-items:end;padding:16px}
.sheet .panel{max-width:720px;width:100%;margin-inline:auto;max-height:85vh;overflow:auto}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.card{flex-direction:row;align-items:flex-start;gap:12px}
.cb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;flex:1}
.th{flex:0 0 72px;width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.hero{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-block:6px 10px}
.desc{margin:4px 0 8px;color:var(--muted);font-size:calc(1rem * var(--fs))}
.list li.grp{font-family:var(--f-display);font-size:1.05rem;color:var(--accent);padding:10px 2px 0}
.imgbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imgbox img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.cw{position:relative;display:grid;min-width:0}
.cw .card{padding-left:56px}
.kebab{position:absolute;top:8px;left:8px;width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;display:grid;place-items:center}
.cmenu{display:flex;gap:8px;flex-wrap:wrap;padding:8px 2px 2px}
</style>

function importBackup(o){

  });

}
function recipeText(r){
  var t=r.title+'\n';
  if(r.desc) t+=r.desc+'\n';
  if(r.time) t+='זמן: '+r.time+'\n'; if(r.yield) t+='מנות: '+r.yield+'\n';
  t+='\nמצרכים\n'+r.ingredients.map(function(x){ return x.charAt(0)==='#'?x:'- '+x; }).join('\n')+'\n\nאופן הכנה\n';
  var n=0; t+=r.steps.map(function(x){ if(x.charAt(0)==='#') return x; n++; return n+'. '+x; }).join('\n');
  if(r.notes) t+='\n\n'+r.notes;
  if(r.source) t+='\n\nמקור: '+r.source;
  return t;
}
function copyText(s,okMsg){
  function fallback(){
    try{
      var ta=document.createElement('textarea'); ta.value=s; ta.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select();
      var ok=document.execCommand('copy'); document.body.removeChild(ta);
      if(ok){ toast(okMsg); return; }
    }catch(e){}
    showSheet(s);
  }
  try{ navigator.clipboard.writeText(s).then(function(){toast(okMsg);},fallback); }catch(e){ fallback(); }
}
function showSheet(s){
  var d=document.createElement('div'); d.className='sheet'; d.id='sheet';
  d.innerHTML='<div class="panel"><div>ההעתקה האוטומטית נחסמה. סמן את הטקסט והעתק ידנית.</div><textarea id="sheetTa" dir="auto" style="min-height:180px;width:100%" readonly>'+esc(s)+'</textarea><button class="btn primary" data-act="sheet-close">סגירה</button></div>';
  document.body.appendChild(d); var ta=$('sheetTa'); ta.focus(); ta.select();
}

function safeImg(s){ return (typeof s==='string'&&s.length<600000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s))?s:''; }
function resizeImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,800/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    im.onerror=function(){ cb(''); };
    im.src=fr.result;
  };
  fr.onerror=function(){ cb(''); };
  fr.readAsDataURL(file);
}

document.addEventListener('click',function(e){

      if(res.backup&&res.backup.text){

      ui.notice=(res.ingredients.length||res.steps.length)?'זוהה אוטומטית. בדוק את השם, המצרכים והשלבים לפני השמירה.':'לא זוהו מצרכים ושלבים. מלא ידנית או הדבק טקסט מלא יותר.';
      go('edit',{draft:res}); break; }
    case 'check':{
      var r0=getRecipe(ui.id); if(!r0) return; var k=b.getAttribute('data-k');
      var c=ui.checks[r0.id]=ui.checks[r0.id]||{}; c[k]=!c[k]; b.setAttribute('aria-pressed',c[k]?'true':'false'); break; }
    case 'fs':{
      var v=Math.min(1.6,Math.max(0.8,(prefs.fs||1)+parseFloat(b.getAttribute('data-d')))); prefs.fs=Math.round(v*10)/10;
      document.documentElement.style.setProperty('--fs',prefs.fs); writeJSON(PREF,prefs); break; }
    case 'wake': toggleWake(); break;

    case 'ed-topic':{ var t=b.getAttribute('data-t'), i=ui.draft.topics.indexOf(t); if(i>=0) ui.draft.topics.splice(i,1); else ui.draft.topics.push(t); renderEdTopics(); break; }

    case 'del-id': ui.menuDel=b.getAttribute('data-id'); renderList(); break;
    case 'del-id-no': ui.menuDel=''; renderList(); break;
    case 'del-id-yes':{ var di=b.getAttribute('data-id'); data.recipes=data.recipes.filter(function(x){return x.id!==di;}); ui.menu=''; ui.menuDel=''; persist(); toast('המתכון נמחק'); renderList(); break; }
    case 'pick-img': $('ed-img').click(); break;
    case 'rm-img': ui.draft.image=''; renderEdImg(); break;
    case 'save': saveDraft(); break;
    case 'topics': go('topics'); break;
    case 'addtopic':{ var nt2=$('tp-new').value.trim(); if(!nt2) return; if(data.topics.indexOf(nt2)>=0){ toast('הנושא כבר קיים'); return; } data.topics.push(nt2); persist(); render(); break; }
    case 'tdel': ui.confirm='tp'+b.getAttribute('data-i'); render(); break;
    case 'tdel-no': ui.confirm=''; render(); break;
    case 'tdel-yes':{ var tn=b.getAttribute('data-t'); data.topics=data.topics.filter(function(x){return x!==tn;});
      data.recipes.forEach(function(r){ r.topics=r.topics.filter(function(x){return x!==tn;}); }); if(ui.topic===tn) ui.topic=''; persist(); ui.confirm=''; render(); break; }
    case 'settings': go('settings'); break;
    case 'quick': go('quick'); break;
    case 'bm-copy': copyText(BM,'הקוד הועתק'); break;
    case 'bk-copy': copyText(exportJSON(),'הגיבוי הועתק. הדבק אותו במקום בטוח'); break;
    case 'bk-save':{
      var f=function(){ toast('שמירה כקובץ לא זמינה כאן. השתמש בהעתקת גיבוי'); var x=$('bkSave'); if(x) x.hidden=true; };
      if(!window.claude||!window.claude.use){ try{ var bl=new Blob([exportJSON()],{type:'application/json'}), an=document.createElement('a'); an.href=URL.createObjectURL(bl); an.download='recipes-backup.json'; document.body.appendChild(an); an.click(); an.remove(); toast('הקובץ נשמר'); }catch(e){ f(); } break; }
      window.claude.use('downloads').then(function(dl){
        if(!dl){ f(); return; }
        dl.save({filename:'recipes-backup.json',data:exportJSON()}).then(function(){toast('הקובץ נשמר');},function(er){ if(er&&er.code!=='declined') f(); });
      },f); break; }
    case 'sheet-close':{ var s=$('sheet'); if(s) s.remove(); break; }
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ ui.q=e.target.value; renderList(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='set-proxy'){ var pv=t.value.trim(); if(pv&&!validUrl(pv)){ toast('הכתובת צריכה להתחיל ב-https'); return; } prefs.proxy=pv; writeJSON(PREF,prefs); toast(pv?'הכתובת נשמרה':'הכתובת נמחקה'); return; }
  if(t.getAttribute&&t.getAttribute('data-act-change')==='rename'){
    var old=t.getAttribute('data-old'), nu=t.value.trim();
    if(!nu||nu===old){ t.value=old; return; }
    if(data.topics.indexOf(nu)>=0){ toast('הנושא כבר קיים'); t.value=old; return; }
    data.topics[data.topics.indexOf(old)]=nu;
    data.recipes.forEach(function(r){ var i=r.topics.indexOf(old); if(i>=0) r.topics[i]=nu; });
    if(ui.topic===old) ui.topic=nu;
    t.setAttribute('data-old',nu); persist(); toast('השם עודכן');
  }
  if(t.id==='ed-img'&&t.files&&t.files[0]){
    resizeImage(t.files[0],function(d){ if(d){ ui.draft.image=d; renderEdImg(); } else toast('לא הצלחתי לקרוא את התמונה'); });
    t.value=''; return;
  }
  if(t.id==='bk-file'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{ var o=JSON.parse(fr.result); if(!o||!o.kitchenLibrary||!Array.isArray(o.recipes)) throw 0;
        var n=importBackup(o); toast(n?('שוחזרו '+n+' מתכונים'):'כל המתכונים כבר קיימים'); go('list');
      }catch(er){ toast('הקובץ אינו גיבוי תקין של הספרייה'); }
    };
    fr.readAsText(t.files[0]);
  }
});

render();
})();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
